.glass{background:linear-gradient(135deg,rgba(255,255,255,.5),rgba(255,255,255,.04) 42%,rgba(255,255,255,.16)),var(--g-bg);-webkit-backdrop-filter:blur(18px) saturate(190%) brightness(1.05);backdrop-filter:blur(18px) saturate(190%) brightness(1.05);border:1px solid var(--g-line);box-shadow:inset 1.5px 1.5px 0 rgba(255,255,255,.75),inset -1px -1px 0 rgba(255,255,255,.3),inset 0 0 16px rgba(255,255,255,.2),0 10px 30px rgba(20,30,40,.14);color:var(--fg)}
.top{position:fixed;z-index:10;top:calc(env(safe-area-inset-top,0px) + 14px);left:16px;right:16px;display:flex;justify-content:space-between;pointer-events:none}
.pill{pointer-events:auto;min-height:44px;padding:0 20px;border-radius:999px;font:inherit;font-weight:500;cursor:pointer}
.pill[aria-pressed="true"]{background:linear-gradient(135deg,rgba(255,255,255,.7),rgba(255,255,255,.1) 60%),var(--g-act);border-color:rgba(255,255,255,.95);box-shadow:inset 1.5px 1.5px 0 #fff,0 6px 18px rgba(20,30,40,.18)}
.screen{min-height:100vh;min-height:calc(100svh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;padding:72px 14px 14px}
.panel{width:100%;max-width:560px;margin:0 auto;padding:16px;border-radius:26px}
.fld{margin-bottom:10px}
.fld label{display:flex;align-items:center;gap:8px;font-size:.8125rem;color:var(--fg2);margin-bottom:6px}
.dot{width:8px;height:8px;border-radius:50%;background:var(--fg)}
.p2 .dot{background:#ff6b5e}
textarea,input{width:100%;font:inherit;color:var(--fg);background:var(--field);border:1px solid var(--g-line);border-radius:14px;padding:11px 13px;resize:none}
textarea{min-height:54px;font-size:1.0625rem}
::placeholder{color:var(--ph)}
.chips{display:flex;gap:7px;overflow-x:auto;margin:2px -2px 12px;padding:2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chips button{flex:none;background:var(--field);color:var(--fg);border:1px solid var(--g-line);border-radius:999px;padding:6px 13px;font:inherit;font-size:.875rem;cursor:pointer}
.row{display:flex;gap:10px}
.row input{flex:1;min-width:0}
#go{flex:none;height:46px;padding:0 20px;border:1px solid rgba(255,255,255,.3);border-radius:14px;font:inherit;font-weight:600;color:#fff;background:linear-gradient(155deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%),var(--red);cursor:pointer;box-shadow:inset 0 1px 0 rgba(255,255,255,.35)}
#go:disabled{opacity:.6;cursor:wait}
:focus-visible{outline:2px solid var(--fg);outline-offset:2px}
.res{max-width:560px;margin:0 auto;padding:0 14px}
.card{display:grid;grid-template-columns:56px 1fr;gap:4px 14px;align-items:start;border-radius:22px;padding:16px;margin-bottom:12px}
.em{grid-row:1/3;width:56px;height:56px;border-radius:16px;background:var(--field);border:1px solid var(--g-line);display:grid;place-items:center;font-size:1.8rem}
.card h2{font-size:1.0625rem;line-height:1.25;font-weight:600;margin:0}
.time{font-size:.8125rem;color:var(--fg2)}
.why{grid-column:1/-1;margin:8px 0 0;color:var(--fg2)}
details{grid-column:1/-1;margin-top:8px;font-size:.9375rem}
summary{cursor:pointer;font-weight:500}
.ing{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0 0;padding:0;list-style:none}
.ing li{background:var(--field);border:1px solid var(--g-line);border-radius:999px;padding:3px 10px;font-size:.8125rem}
.links{grid-column:1/-1;display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:12px}
.links a{text-align:center;text-decoration:none;color:var(--fg);background:var(--field);border:1px solid var(--g-line);border-radius:12px;padding:10px 4px;font-size:.9375rem;font-weight:500}
.links a:first-child{color:#fff;background:linear-gradient(155deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%),var(--red);border-color:rgba(255,255,255,.3)}
.sk{height:128px;border-radius:22px;margin-bottom:12px;animation:p 1.2s ease-in-out infinite}
@keyframes p{50%{opacity:.55}}
@media (prefers-reduced-motion:reduce){.sk{animation:none}}
.msg{padding:14px 16px;border-radius:18px;margin:0 0 12px;text-align:center}
.err{color:var(--err)}
.more{width:100%;min-height:48px;border-radius:16px;font:inherit;font-weight:500;cursor:pointer;margin-bottom:8px}
.note{font-size:.8125rem;color:var(--note);text-align:center;margin:12px 16px 28px}

.know{width:100%;margin-top:10px;min-height:46px;border-radius:14px;font:inherit;font-weight:500;cursor:pointer;display:flex;align-items:center;justify-content:center;gap:10px}
.know span{color:var(--fg2);font-weight:400;font-size:.875rem}
.tin{position:fixed;inset:0;z-index:12;display:flex;flex-direction:column;align-items:center;padding:calc(env(safe-area-inset-top,0px) + 14px) 16px calc(env(safe-area-inset-bottom,0px) + 16px)}
.tintop{width:100%;display:flex;justify-content:space-between}
.tc{pointer-events:none}
.tdeck{flex:1;width:100%;max-width:340px;position:relative;margin:16px 0;min-height:340px}
.tcard{position:absolute;left:0;right:0;top:0;bottom:0;margin:auto 0;height:min(390px,100%);border-radius:30px;padding:28px 22px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;touch-action:pan-y;user-select:none;-webkit-user-select:none;will-change:transform}
.tcard.back{transform:scale(.95) translateY(12px);opacity:.7;pointer-events:none}
.temo{font-size:4.5rem;line-height:1;margin-bottom:16px}
.tcard h3{margin:0 0 8px;font-size:1.4rem;line-height:1.2;font-weight:600}
.tcard p{margin:0 0 16px;color:var(--fg2)}
.ttags{display:flex;flex-wrap:wrap;gap:6px;justify-content:center}
.ttags span{background:var(--field);border:1px solid var(--g-line);border-radius:999px;padding:4px 11px;font-size:.8125rem}
.stamp{position:absolute;top:18px;padding:3px 12px;border:2px solid var(--fg);border-radius:10px;font-weight:600;opacity:0}
.stamp.y{left:18px;transform:rotate(-8deg)}
.stamp.n{right:18px;transform:rotate(8deg)}
.tbtns{display:flex;gap:18px;align-items:center}
.rb{width:60px;height:60px;border-radius:50%;font:inherit;font-size:1.4rem;cursor:pointer;display:grid;place-items:center;padding:0}
.rb.sm{width:46px;height:46px;font-size:1.1rem}
.rb.y{color:#fff;background:linear-gradient(155deg,rgba(255,255,255,.3),rgba(255,255,255,0) 45%),var(--red)}
.thint{margin:12px 0 0;font-size:.8125rem;color:var(--note)}
.tmsg{align-self:center;margin:auto;width:100%;text-align:center;padding:16px;border-radius:20px}
.tmsg button{margin-top:12px;font:inherit;font-weight:500;color:var(--fg);background:var(--field);border:1px solid var(--g-line);border-radius:12px;padding:10px 18px;cursor:pointer}
[hidden]{display:none!important}
</style>
</head>

var STEM={"хруст":"хрустящее","солён":"солёное","солен":"солёное","остр":"острое","пряно":"острое","слад":"сладкое","сыт":"сытное","плотн":"сытное","лёгк":"лёгкое","легк":"лёгкое","горяч":"горячее","тёпл":"горячее","тепл":"горячее","холодн":"холодное","мяс":"мясо","рыб":"рыба","морепр":"рыба","сливоч":"сливочное","кисл":"кислое","сыр":"сырное","огур":"огурцы","суп":"суп","десерт":"десерт","завтрак":"завтрак","паст":"паста","овощ":"овощи","курин":"курица","куриц":"курица","яйц":"яйца","азиат":"азиатское","итальян":"итальянское","жарен":"жареное","свеж":"свежее","шоколад":"шоколад","фрукт":"фрукты","ягод":"фрукты","быстр":"быстро","гриб":"грибы","картоф":"картофель","рис":"рис"};
function parse(q){q=q.toLowerCase();var ex=[],tags={},rest=[];
if(/без\s+мяс/.test(q))ex.push("мясо","курица");if(/без\s+рыб/.test(q))ex.push("рыба");
q.split(/[^а-яёa-z]+/).filter(function(w){return w.length>3}).forEach(function(w){var hit=false;for(var k in STEM){if(w.indexOf(k)===0){tags[STEM[k]]=1;hit=true}}if(!hit)rest.push(w.slice(0,5))});
ex.forEach(function(t){delete tags[t]});
return{tags:Object.keys(tags),rest:rest,ex:ex}}
function sc(d,P){var i,s=0;for(i=0;i<P.ex.length;i++)if(d.tags.indexOf(P.ex[i])>-1)return -99;
P.tags.forEach(function(t){if(d.tags.indexOf(t)>-1)s+=2});
var hay=(d.name+" "+d.ingredients.join(" ")).toLowerCase();P.rest.forEach(function(w){if(w.length>3&&hay.indexOf(w)>-1)s+=3});return s}
function hit(d,P){return P.tags.filter(function(t){return d.tags.indexOf(t)>-1})}
function why(d,P1,P2,tw){
if(tw){var a=hit(d,P1),b=hit(d,P2);if(a.length||b.length)return"Вам: "+(a.join(", ")||"просто вкусно")+". Второму: "+(b.join(", ")||"просто вкусно")+".";return"Классика, которая обычно нравится всем."}
var h=hit(d,P1);return h.length?"Подходит под: "+h.join(", ")+".":"Классика, которая редко подводит."}
function out(list,w){return{dishes:list.map(function(x){var d=x.d;return{name:d.name,emoji:d.emoji,time_min:d.time_min,ingredients:d.ingredients,why:w(d)}})}}
function pick(a,b,tw){var P1=parse(a),P2=tw?parse(b):null;
var l=DB.filter(function(d){return seen.indexOf(d.name)<0}).map(function(d){var s1=sc(d,P1),s2=tw?sc(d,P2):0,s=tw?(s1<0||s2<0?-99:Math.min(s1,s2)*2+s1+s2):s1;return{d:d,s:s+Math.random()*.9}}).filter(function(x){return x.s>-50}).sort(function(x,y){return y.s-x.s}).slice(0,3);
return out(l,function(d){return why(d,P1,P2,tw)})}
function profile(o){var w={};
o.liked.forEach(function(x){(x.all||x.tags).forEach(function(t){w[t]=(w[t]||0)+1})});
o.nope.forEach(function(x){(x.all||x.tags).forEach(function(t){w[t]=(w[t]||0)-.7})});
var l=DB.filter(function(d){return seen.indexOf(d.name)<0&&o.skip.indexOf(d.name)<0}).map(function(d){var s=0;d.tags.forEach(function(t){s+=w[t]||0});return{d:d,s:s+Math.random()*.6}}).sort(function(x,y){return y.s-x.s}).slice(0,3);
return out(l,function(d){var t=d.tags.filter(function(t){return w[t]>0}).sort(function(a,b){return w[b]-w[a]}).slice(0,3);return t.length?"Похоже на то, что вам зашло: "+t.join(", ")+".":"Попробуйте что-то новое."})}
function deck(){var pool=DB.slice().sort(function(){return Math.random()-.5}),r=[];
while(r.length<8&&pool.length){var bi=0,bs=1e9;pool.forEach(function(d,i){var o=Math.random();r.forEach(function(x){d.tags.forEach(function(t){if(x.all.indexOf(t)>-1)o++})});if(o<bs){bs=o;bi=i}});var d=pool.splice(bi,1)[0];r.push({name:d.name,emoji:d.emoji,desc:"Внутри: "+d.ingredients.slice(0,4).join(", ")+".",tags:d.tags.slice(0,3),all:d.tags})}
return r}

function bind(c){
var y=c.querySelector(".stamp.y"),n=c.querySelector(".stamp.n");
c.addEventListener("pointerdown",function(e){T.drag=true;T.x0=e.clientX;c.setPointerCapture(e.pointerId)});

c.addEventListener("pointerup",function(e){if(!T.drag)return;T.drag=false;var dx=e.clientX-T.x0;if(Math.abs(dx)>100)tswipe(dx>0);else{c.style.transform="";y.style.opacity=0;n.style.opacity=0}});

function tswipe(like){
if(!T.cur||T.busy)return;T.busy=true;hap(like?"medium":"light");var d=T.list[T.i];T.hist.push(like);(like?T.liked:T.nope).push(d);

tin.hidden=true;bb(false);run(false,{liked:T.liked,nope:T.nope,skip:T.list.map(function(x){return x.name})})}
